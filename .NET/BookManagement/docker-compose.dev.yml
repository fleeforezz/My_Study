version: '3.9'

services:
  api:
    container_name: bookmanagement-api
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=BookManagement;Username=jso;Password=TMNNT012928637160822863716
    depends_on:
      - db
    # Only mount NuGet cache, not source code for now
    volumes:
      - nuget_cache:/root/.nuget/packages

  db:
    image: postgres:15
    container_name: bookmanagement-db
    restart: always
    environment:
      - POSTGRES_USER=jso
      - POSTGRES_PASSWORD=TMNNT012928637160822863716
      - POSTGRES_DB=BookManagement
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  nuget_cache: